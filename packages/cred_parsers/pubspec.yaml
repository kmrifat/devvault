publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  meta: ^1.19.0
  pointycastle: ^4.0.0
  vault_core: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

name: devvault_mcp
description: "devvault-mcp: the MCP server AI agents run to ask DevVault for credentials, with the user's approval in the app. Pure Dart."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.4

executables:
  devvault-mcp: devvault_mcp

dependencies:
  agent_bridge:
    path: ../agent_bridge
  # Experimental and fast-moving (ADR-0006): pinned, and used only in
  # lib/src/mcp_server.dart.
  dart_mcp: 0.5.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

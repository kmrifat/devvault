name: Desktop checks

# The Windows and Linux half of the P2-13 checks, on real runners
# (docs/acceptance/v1.md):
# - the OS keychain keeps a key across two launches (libsecret through an
#   unlocked GNOME Keyring on Linux; DPAPI-protected storage on Windows);
# - the AppImage starts and stays up;
# - the MSIX installs and DevVault starts from it. The MSIX is signed with a
#   throwaway certificate made in the run, because Windows installs only a
#   signed MSIX; the release certificate is never used here.
# Each job uploads a screenshot of the running app.

on:
  pull_request:
    paths:
      - .github/workflows/desktop-checks.yml
      - integration_test/keyring_test.dart
      - lib/services/credential_store.dart
      - tool/release/**
      - linux/**
      - windows/**
      - pubspec.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-checks.yml
      - integration_test/keyring_test.dart
      - lib/services/credential_store.dart
      - tool/release/**
      - linux/**
      - windows/**
      - pubspec.yaml
  workflow_dispatch:

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  linux:
    name: Linux (libsecret, AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            xvfb dbus-x11 gnome-keyring imagemagick
      - run: flutter pub get
      - name: Session bus, an unlocked login keyring and a display
        run: |
          eval "$(dbus-launch --sh-syntax)"
          mkdir -p ~/.local/share/keyrings
          printf login > ~/.local/share/keyrings/default
          printf ci | gnome-keyring-daemon --daemonize --unlock --components=secrets > /dev/null
          Xvfb :99 -screen 0 1440x900x24 &
          {
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
            echo "DISPLAY=:99"
          } >> "$GITHUB_ENV"
      - name: libsecret keeps a key across launches
        run: |
          for phase in write read; do
            flutter test integration_test/keyring_test.dart -d linux \
              --dart-define=KEYRING_PHASE=$phase \
              --dart-define=KEYRING_VALUE=run-$GITHUB_RUN_ID \
              --reporter expanded
          done
      - run: flutter build linux --release
      - run: tool/release/linux_appimage.sh
      - name: The AppImage starts and stays up
        run: |
          chmod +x devvault-linux-x64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./devvault-linux-x64.AppImage > appimage.log 2>&1 &
          sleep 20
          import -window root linux-appimage.png || true
          if ! pgrep -f usr/lib/devvault/devvault > /dev/null; then
            cat appimage.log
            echo "::error::DevVault exited within 20 s of starting the AppImage"
            exit 1
          fi
          pkill -f usr/lib/devvault/devvault
          cat appimage.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-checks-linux
          path: |
            linux-appimage.png
            appimage.log
          if-no-files-found: ignore

  windows:
    name: Windows (protected storage, MSIX)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Windows storage keeps a key across launches
        shell: bash
        run: |
          for phase in write read; do
            flutter test integration_test/keyring_test.dart -d windows \
              --dart-define=KEYRING_PHASE=$phase \
              --dart-define=KEYRING_VALUE=run-$GITHUB_RUN_ID \
              --reporter expanded
          done
      - run: flutter build windows --release
      - name: MSIX, signed with a throwaway certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=DevVault CI' `
            -KeyUsage DigitalSignature -FriendlyName 'DevVault CI' `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $password = [Guid]::NewGuid().ToString()
          $pfx = Join-Path $env:RUNNER_TEMP 'devvault-ci.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP 'devvault-ci.cer') | Out-Null
          $env:SIGN_WINDOWS = 'true'
          $env:WINDOWS_CERT_PFX_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
          $env:WINDOWS_CERT_PASSWORD = $password
          Remove-Item $pfx
          ./tool/release/windows_msix.ps1
      - name: The MSIX installs and DevVault starts
        shell: pwsh
        run: |
          Import-Certificate -FilePath (Join-Path $env:RUNNER_TEMP 'devvault-ci.cer') `
            -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path devvault-windows-x64.msix
          $pkg = Get-AppxPackage -Name BinaryCastle.DevVault
          if (-not $pkg) { throw 'The MSIX did not install' }
          $appId = (Get-AppxPackageManifest $pkg).Package.Applications.Application.Id
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!$appId"
          Start-Sleep -Seconds 20
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen(
              $bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save('windows-msix.png')
          } catch { Write-Host "No screenshot: $_" }
          $proc = Get-Process -Name devvault -ErrorAction SilentlyContinue
          if (-not $proc) { throw 'DevVault exited within 20 s of starting from the MSIX' }
          Write-Host "Running from $($proc[0].Path)"
          $proc | Stop-Process
          Remove-AppxPackage -Package $pkg.PackageFullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-checks-windows
          path: windows-msix.png
          if-no-files-found: ignore

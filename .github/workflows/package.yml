name: Package

# Release bundles for Windows and Linux: a zip of the Windows runner folder
# and a tarball of the Linux bundle, attached to the run as artifacts.
# They run on version tags and on demand. Signed installers (MSIX, macOS
# notarisation, AppImage) come with the release work in P1-24 / P4-09.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - name: Bundle (Linux)
        if: matrix.target == 'linux'
        run: |
          tar -C build/linux/x64/release/bundle -czf devvault-linux-x64.tar.gz .
      - name: Bundle (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath devvault-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: devvault-${{ matrix.target }}-x64
          path: devvault-${{ matrix.target }}-x64.*
          if-no-files-found: error

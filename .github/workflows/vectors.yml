name: Format vectors

# docs/format/vectors is the vault format contract. A second, independent
# implementation in Go (tools/vectorcheck, x/crypto only) must verify every
# vector and unlock the committed mini-vault.

on:
  pull_request:
    # labeled/unlabeled: the no-format-change label re-runs the SPEC check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - docs/format/**
      - tools/vectorcheck/**
      - packages/vault_core/**
      - tool/ci/spec_guard.sh
      - .github/workflows/vectors.yml
  push:
    branches: [main]
    paths:
      - docs/format/**
      - tools/vectorcheck/**
      - packages/vault_core/**
  workflow_dispatch:

jobs:
  go-verifier:
    name: Go verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vectorcheck/go.mod
          cache-dependency-path: tools/vectorcheck/go.sum
      - name: Verify vectors
        working-directory: tools/vectorcheck
        run: go vet ./... && go run . ../../docs/format/vectors

  spec-updated:
    # PR-8: format code and docs/format/SPEC.md change together.
    name: SPEC updated with the format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format code changed ⇒ SPEC changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_FORMAT_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-format-change') }}
        run: tool/ci/spec_guard.sh "$BASE"

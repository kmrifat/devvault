name: Checks

# Linux runs on every PR. macOS and Windows minutes cost 10x and 2x on a
# private repo, so goldens run only when the app or its screenshots change,
# and full desktop builds run on main (see builds.yml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  analyze-test:
    name: Analyze + test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test packages
      - run: flutter analyze --no-fatal-infos
      - name: App tests (goldens run on macOS)
        run: flutter test --exclude-tags golden
      - name: Expiry rules and reminders in other time zones (P4-01, P4-03)
        run: |
          for tz in America/New_York Europe/Berlin Australia/Lord_Howe Asia/Kolkata Pacific/Chatham; do
            echo "TZ=$tz"
            TZ=$tz flutter test test/expiry_test.dart test/notification_plan_test.dart
          done
      - name: Package tests
        run: |
          for p in packages/*/; do
            echo "::group::$p"
            (cd "$p" && dart analyze && dart test)
            echo "::endgroup::"
          done

  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the app, its tests or its screenshots change?
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(lib|test|assets|screenshots)/|^pubspec\.(yaml|lock)$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  goldens:
    name: Goldens (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/screenshots/failures/

name: Platform round-trip

# The P0 gate: vault_core, with libsodium compiled for each platform, must
# give Go's known answers and complete a full vault round-trip inside the
# real app. Linux, Windows and Android run on cheap runners; macOS and iOS
# (10x minutes) run when dispatched by hand.

on:
  pull_request:
    paths:
      - integration_test/**
      - .github/workflows/roundtrip.yml
  push:
    branches: [main]
    paths:
      - packages/vault_core/**
      - integration_test/**
  workflow_dispatch:
    inputs:
      apple:
        description: Also run on macOS and an iOS simulator
        type: boolean
        default: false

concurrency:
  group: roundtrip-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb
      - run: flutter pub get
      - run: xvfb-run -a flutter test integration_test -d linux --reporter expanded

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test -d windows --reporter expanded

  android:
    name: Android (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          script: flutter test integration_test -d emulator-5554 --reporter expanded

  apple:
    name: macOS + iOS simulator
    if: github.event_name == 'workflow_dispatch' && inputs.apple
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test -d macos --reporter expanded
      - name: iOS simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          flutter test integration_test -d "$udid" --reporter expanded

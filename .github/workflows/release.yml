name: Release

# v1 release builds for the three desktop platforms (P4-09). On a version
# tag they are built, signed where the secrets exist, checksummed and
# attached to a draft GitHub Release. Without the secrets each artifact is
# built unsigned and named so.
#
# The phones go to their stores instead (P3-08): on a version tag, iOS is
# archived and uploaded to TestFlight, Android's signed bundle to Play's
# internal testing track. Other runs build them unsigned, as a check.
#
# Secrets (docs/release.md): MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD,
# APPLE_TEAM_ID, APPLE_ID, APPLE_APP_PASSWORD; WINDOWS_CERT_PFX_BASE64,
# WINDOWS_CERT_PASSWORD; LINUX_GPG_PRIVATE_KEY, LINUX_GPG_PASSPHRASE;
# IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD,
# APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
# APP_STORE_CONNECT_KEY_P8_BASE64; ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
# PLAY_SERVICE_ACCOUNT_JSON.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Dry-run the unsigned path whenever the release machinery changes.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tool/release/**
      - pubspec.yaml
      - android/app/build.gradle.kts

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    env:
      # Whether this run can sign each platform (secrets are empty on forks
      # and pull requests).
      SIGN_MACOS: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_ID != '' }}
      SIGN_WINDOWS: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      SIGN_LINUX: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release

      # macOS: Developer ID + hardened runtime, notarized DMG.
      - name: Sign and notarize (macOS)
        if: matrix.target == 'macos' && env.SIGN_MACOS == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: tool/release/macos_sign_notarize.sh
      - name: Unsigned DMG (macOS)
        if: matrix.target == 'macos' && env.SIGN_MACOS != 'true'
        run: |
          hdiutil create -volname DevVault \
            -srcfolder build/macos/Build/Products/Release/DevVault.app \
            -ov -format UDZO DevVault-macos-unsigned.dmg

      # Windows: Authenticode-signed exe and DLLs, zipped.
      - name: Sign (Windows)
        if: matrix.target == 'windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: tool/release/windows_sign.ps1
      - name: Zip (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $name = if ($env:SIGN_WINDOWS -eq 'true') { 'devvault-windows-x64.zip' } else { 'devvault-windows-x64-unsigned.zip' }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $name
      - name: MSIX (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: tool/release/windows_msix.ps1

      # Linux: tarball and AppImage, each with a detached GPG signature.
      - name: Tarball (Linux)
        if: matrix.target == 'linux'
        run: tar -C build/linux/x64/release/bundle -czf devvault-linux-x64.tar.gz .
      - name: AppImage (Linux)
        if: matrix.target == 'linux'
        run: tool/release/linux_appimage.sh
      - name: Sign (Linux)
        if: matrix.target == 'linux' && env.SIGN_LINUX == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          for file in devvault-linux-x64.tar.gz devvault-linux-x64.AppImage; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --armor --detach-sign "$file"
            gpg --verify "$file.asc" "$file"
          done
          rm -rf "$GNUPGHOME"
      - name: Mark unsigned (Linux)
        if: matrix.target == 'linux' && env.SIGN_LINUX != 'true'
        run: |
          mv devvault-linux-x64.tar.gz devvault-linux-x64-unsigned.tar.gz
          mv devvault-linux-x64.AppImage devvault-linux-x64-unsigned.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: devvault-${{ matrix.target }}
          path: |
            DevVault-macos*.dmg
            devvault-windows-x64*.zip
            devvault-windows-x64*.msix
            devvault-linux-x64*.tar.gz*
            devvault-linux-x64*.AppImage*
          if-no-files-found: error

  store:
    name: Store build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: ios
          - os: ubuntu-latest
            target: android
    env:
      # Only a version tag goes to the stores; other runs just build.
      TAGGED: ${{ startsWith(github.ref, 'refs/tags/v') }}
      UPLOAD_IOS: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      SIGN_ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      UPLOAD_ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get

      # iOS: TestFlight on a tag with the secrets, an unsigned app otherwise.
      - name: Archive and upload to TestFlight (iOS)
        if: matrix.target == 'ios' && env.UPLOAD_IOS == 'true' && env.TAGGED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          flutter build ios --release --config-only
          tool/release/ios_testflight.sh
      - name: Unsigned app (iOS)
        if: matrix.target == 'ios' && !(env.UPLOAD_IOS == 'true' && env.TAGGED == 'true')
        run: |
          flutter build ios --release --no-codesign
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app DevVault-ios-unsigned.zip

      # Android: an app bundle signed with the upload key, to Play's
      # internal testing track on a tag. Without the keystore it keeps the
      # debug key (android/app/build.gradle.kts) and is named -unsigned.
      - name: Upload keystore (Android)
        if: matrix.target == 'android' && env.SIGN_ANDROID == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: App bundle (Android)
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          name=devvault-android.aab
          if [ "$SIGN_ANDROID" != true ]; then name=devvault-android-unsigned.aab; fi
          cp build/app/outputs/bundle/release/app-release.aab "$name"
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Upload to Play internal testing (Android)
        if: matrix.target == 'android' && env.UPLOAD_ANDROID == 'true' && env.TAGGED == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.binarycastle.devvault
          releaseFiles: devvault-android.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'android' || hashFiles('DevVault-ios-unsigned.zip') != ''
        with:
          name: store-${{ matrix.target }}
          path: |
            DevVault-ios-unsigned.zip
            devvault-android*.aab
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # The desktop files; phone builds went to their stores.
          pattern: devvault-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "DevVault ${GITHUB_REF_NAME#v}" \
            --notes "Draft: check docs/acceptance/v1.md before publishing. Files ending in -unsigned were built without signing secrets."

name: Spike · desktop UI kits

# Throwaway (spike/desktop-native-ui): builds lib/spike/desktop_spike.dart
# with each UI kit on each desktop OS, launches it on the real runner and
# takes a screenshot of the screen, so the kits can be compared as they
# really render, and we learn whether each kit runs off its home OS.

on:
  push:
    branches: ['spike/**']
    paths:
      - lib/spike/**
      - .github/workflows/spike-desktop-ui.yml
      - pubspec.yaml
  workflow_dispatch:

jobs:
  shot:
    name: ${{ matrix.kit }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        kit: [macos, fluent, yaru]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb imagemagick
      - run: flutter pub get

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: flutter build macos --release -t lib/spike/desktop_spike.dart --dart-define=KIT=${{ matrix.kit }}
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: flutter build windows --release -t lib/spike/desktop_spike.dart --dart-define=KIT=${{ matrix.kit }}
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: flutter build linux --release -t lib/spike/desktop_spike.dart --dart-define=KIT=${{ matrix.kit }}

      - name: Run and screenshot (macOS)
        if: runner.os == 'macOS'
        run: |
          open -n build/macos/Build/Products/Release/DevVault.app
          sleep 20
          screencapture -x shot.png
          pgrep -x DevVault >/dev/null && echo "still running" || echo "NOT RUNNING (crashed?)"
      - name: Run and screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process build/windows/x64/runner/Release/devvault.exe -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shot.png")
          if ($p.HasExited) { "NOT RUNNING (exit $($p.ExitCode))" } else { "still running" }
      - name: Run and screenshot (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            ./build/linux/x64/release/bundle/devvault > app.log 2>&1 &
            sleep 20
            import -window root shot.png
            kill -0 $! 2>/dev/null && echo "still running" || echo "NOT RUNNING (crashed?)"
          '
          tail -20 app.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-${{ matrix.kit }}-${{ runner.os }}
          path: shot.png
          if-no-files-found: warn

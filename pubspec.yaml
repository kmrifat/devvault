name: devvault
description: "Local-first, end-to-end encrypted vault for developer credential files."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Pure-Dart packages developed alongside the app. See docs/adr/0001-workspace.md.
workspace:
  - packages/vault_core
  - packages/cred_parsers
  - packages/vault_s3

dependencies:
  bc_ui: ^0.7.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.21
  path_provider: ^2.1.6
  uuid: ^4.6.0
  vault_core: ^0.1.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # bc_ui bundles Inter under its own package namespace, but its text styles
  # ask for the bare 'Inter' family, which only resolves if the app registers
  # the font itself. JetBrains Mono renders key IDs, fingerprints and
  # filenames (AppText.mono). Both fonts are SIL OFL 1.1, see assets/fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

name: devvault
description: "Local-first, end-to-end encrypted vault for developer credential files."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Pure-Dart packages developed alongside the app. See docs/adr/0001-workspace.md.
workspace:
  - packages/biometric_key
  - packages/device_privacy
  - packages/vault_core
  - packages/cred_parsers
  - packages/vault_s3
  - packages/agent_bridge
  - packages/devvault_mcp

dependencies:
  agent_bridge: ^0.1.0
  bc_ui: ^0.7.0
  biometric_key: ^0.1.0
  device_privacy: ^0.1.0
  cred_parsers: ^0.1.0
  desktop_drop: ^0.8.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.21
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  timezone: ^0.11.1
  uuid: ^4.6.0
  vault_core: ^0.1.0
  vault_s3: ^0.1.0
  window_manager: ^0.5.2
  macos_ui: ^2.2.2
  fluent_ui: ^4.16.1
  yaru: ^10.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

flutter:
  uses-material-design: true

  # bc_ui bundles Inter under its own package namespace, but its text styles
  # ask for the bare 'Inter' family, which only resolves if the app registers
  # the font itself. JetBrains Mono renders key IDs, fingerprints and
  # filenames (AppText.mono). Both fonts are SIL OFL 1.1, see assets/fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

# App icons for every platform (P4-08), from the sources rendered by
# test/tool/app_icon_test.dart. Regenerate with:
#   DEVVAULT_RENDER_ICON=1 flutter test test/tool/app_icon_test.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#0485F7"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0485F7"
  macos:
    generate: true
    image_path: assets/icon/app_icon_macos.png
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
  web:
    generate: false

# Windows MSIX (P2-13), packaged by release.yml from the release build with
# tool/release/windows_msix.ps1. The identity matches the notification AUMID;
# the publisher comes from the signing certificate when there is one.
msix_config:
  display_name: DevVault
  publisher_display_name: Binary Castle
  identity_name: BinaryCastle.DevVault
  logo_path: assets/icon/app_icon.png
  capabilities: internetClient
  build_windows: false
  install_certificate: false
  store: false
